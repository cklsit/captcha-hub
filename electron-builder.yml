appId: com.captchahub.desktop
productName: Captcha Hub
copyright: Copyright © 2024 Captcha Hub
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Captcha Hub
