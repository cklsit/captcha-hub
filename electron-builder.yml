appId: com.mailhub.desktop
productName: Mail Hub
copyright: Copyright © 2024 Mail Hub
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mail Hub
